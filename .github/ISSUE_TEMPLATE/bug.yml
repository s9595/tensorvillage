name: Something's broken
description: A crash, a wrong result, or behaviour that doesn't match the README
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Tensor Village version
      description: Shown at the bottom-left of the app window.
      placeholder: v0.14.0
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Relevant lines from the log
      description: |
        `%LOCALAPPDATA%\TensorVillage\tray.log` — or Tools → Open log. The last few lines
        around the problem are usually enough; no need for the whole file.
      render: text

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2

  - type: checkboxes
    id: drives
    attributes:
      label: Anything unusual about the setup?
      options:
        - label: Models are spread across more than one drive
        - label: Some model folders are on a NAS or network share
        - label: The drive letter conflicted with something else on startup
