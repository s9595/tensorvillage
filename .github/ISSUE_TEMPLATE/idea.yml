name: An idea
description: Something Tensor Village should do that it doesn't
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like it to do
      description: |
        What you're trying to get done matters more than the feature — if there's a way
        to solve it that's simpler than the one you have in mind, I'd rather find it.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you handle it today
      description: Even "I don't, I just live with it" is useful to know.
